{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kargo.names.fullname" . }}-workspace
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "kargo.labels.standard" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  # Only set when asked for: an empty storageClassName is not "use the
  # default", it is "use no class at all", which disables dynamic
  # provisioning and leaves the claim Pending forever.
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
