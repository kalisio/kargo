# katalog default values

global:
  # secret where to share sentitive environment variables
  secret: ""

# commonAnnotations are annotations to be added to all resources (sub-charts are not considered). Evaluated as a template
commonAnnotations: {}

# commoneLabels are labels to be added to all resources (sub-charts are not considered). Evaluated as a template
commonLabel: {}

# replicatCount is the number of replicas
replicaCount: 1

image:
  repository: kalisio/service-katalog
  tag: ""
  pullPolicy: IfNotPresent

# forceRestart forces the pod to be restarted when upgrading the chart
forceRestart: false

service:
  enabled: true
  type: ClusterIP
  port: 8187
  annotations: {}

ingress:
  enabled: false

distribution:
  # enabled specifies whether or not to use distribution
  enabled: true
  # basePort specifies the starting port of the port range
  basePort: 10030
  # highestPort specifies the ending port of the port range
  highestPort: 10039
  # delay specifies the time to wait before starting service discovery
  startDelay: "20000"
  # redisUrl specifies the redis connection string
  redisUrl:
    secret: ""
    key: ""

# containerPort is the port used by the the container
containerPort: 8187

# livenessEndpoint is the endpoint to check the pod liveness
livenessEndpoint: /api/healthcheck

env:
  # baseUrl is the base url of the server to be accessed
  baseUrl: "http://planet-katalog:8187"

# Layer overrides.
#
# By default katalog uses the layer files baked into its image
# (config/layers/<theme>/<file>.cjs). To override a specific layer file for
# a given environment without touching the others:
#   1. Put the overriding .cjs file in this chart's files/layers/ folder.
#   2. Enable additionalConfig below and map each file to its full path in
#      the container. The subPath mount replaces only that file; all other
#      layers from the image stay in place.
#
# Example (overriding weather/awc-layers.cjs):
#   additionalConfig:
#     configMap: '{{ include "kargo.names.name" . }}-layers'
#     fileMapping:
#       awc-layers.cjs: /app/packages/service-katalog/config/layers/weather/awc-layers.cjs
additionalConfig: {}

# resources are resource requests and limits to be applied
resources: {}

# default security context, run as non root uid 1000
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
