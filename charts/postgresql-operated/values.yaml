# Default values for postgresql-operated Chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# global values, usually set by helmfile
# global.secret is the name of the namespace secret (SOPS managed), used by default
# for the S3 credentials of barmanCloud
global: {}

# nameOverride allow user to override chart name
nameOverride: ""

image:
  # registry defines the prefix of the container image
  # it could be overriden to use internal repository
  registry: "ghcr.io/cloudnative-pg"
  # name define the suffix of the container image
  # possible names: postgresql, postgis
  # https://github.com/cloudnative-pg/postgres-containers/pkgs/container/postgresql/versions?filters%5Bversion_type%5D=tagged
  # https://github.com/cloudnative-pg/postgis-containers/pkgs/container/postgis/versions?filters%5Bversion_type%5D=tagged
  name: postgresql
  # version defines the tag of the images, defaults to the chart appVersion.
  # Always use a precise minor version (e.g. 17.6-standard-trixie), never a floating tag.
  # The "standard" flavour is enough with the barman-cloud plugin; the "system" flavour
  # (e.g. 17-system-trixie) is only required by the legacy in-tree "backup" section.
  # version: 13-3.6-system-trixie
  version: ""
  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  pullSecrets: []
  # pullPolicy allow to always download or not the container image
  pullPolicy: IfNotPresent

# number of replicas in the replicaset of postgresql
replicaCount: 1

# pod annotations
podAnnotations: {}

# bootstrap section default configuration will create one database called app
# and generate automatically user / password
# see reference https://cloudnative-pg.io/docs/1.28/bootstrap#the-bootstrap-section
# Warning: the bootstrap is executed only once, when the cluster is created.
# Changing it afterwards has no effect on the existing database: use the
# "databases" and "managed.roles" sections below instead.
#
# bootstrap:
#   initdb:
#     database: mymap
#     owner: map-user
#     secret:
#       name: map-user-secret
#
# Import from an existing database (e.g. migration from Bitnami), see
# https://cloudnative-pg.io/docs/1.28/database_import (requires externalClusters)
#
# bootstrap:
#   initdb:
#     database: traccar
#     owner: traccar
#     import:
#       type: microservice
#       databases: [ traccar ]
#       source:
#         externalCluster: import-source
#
# Recovery from the barman-cloud object store (requires externalClusters)
# see https://cloudnative-pg.io/plugin-barman-cloud/docs/usage/
#
# bootstrap:
#   recovery:
#     source: origin
#     recoveryTarget:
#       targetTime: "2026-11-23 12:15:00+00"
bootstrap:
  initdb:
    database: app
    owner: app

# ownerCredentials allows to provide the password of the database owner
# (bootstrap.initdb.owner), typically from the SOPS secrets of the namespace.
# A kubernetes.io/basic-auth secret <cluster>-owner-credentials is then created
# and used by initdb, so that applications keep their existing password.
# When empty, CNPG generates a password in the <cluster>-app secret.
ownerCredentials:
  password: ""

# externalClusters allows to declare other PostgreSQL servers, used as a source
# by the import (bootstrap.initdb.import) or the recovery (bootstrap.recovery)
# see reference https://cloudnative-pg.io/docs/1.28/cloudnative-pg.v1#externalcluster
#
# externalClusters:
#   # legacy database to import
#   - name: import-source
#     connectionParameters:
#       host: postgresql
#       user: postgres
#       dbname: postgres
#       sslmode: disable
#     password:
#       name: dev
#       key: postgresql-admin-password
#   # backups of a cluster stored by the barman-cloud plugin
#   - name: origin
#     plugin:
#       name: barman-cloud.cloudnative-pg.io
#       parameters:
#         barmanObjectName: traccardb-postgresql-operated-backup
#         serverName: traccardb-postgresql-operated
externalClusters: []

# postgresql section allows to provide custom parameters in the postgresql configuration
# it's injected at the end of the postgresql.conf generated by the operator
# with "include 'custom.conf'"
# see reference https://cloudnative-pg.io/docs/1.28/postgresql_conf
#
# postgresql:
#   parameters:
#     shared_buffers: "1GB"
#   pg_hba:
#     - hostssl app app 10.244.0.0/16 md5
postgresql: {}

# managed allows to manage roles declaratively, also after the bootstrap
# see reference https://cloudnative-pg.io/docs/1.28/declarative_role_management
#
# managed:
#   roles:
#     - name: reader
#       ensure: present
#       login: true
#       inRoles: [ pg_read_all_data ]
#       passwordSecret:
#         name: reader-credentials
managed: {}

# databases allows to manage additional databases declaratively (Database resources),
# also after the bootstrap, including their extensions and schemas
# see reference https://cloudnative-pg.io/docs/1.28/declarative_database_management
#
# databases:
#   - name: chirpstack
#     owner: chirpstack
#     extensions:
#       - name: pg_trgm
#       - name: hstore
databases: []

# superuserSecretName allow to specify the super user password
# instead of a generated one
# this must be the name of a secret with two keys user and password
superuserSecretName: ""

# storage section
# see reference https://cloudnative-pg.io/docs/1.28/storage
#
# storage:
#   storageClass: csi-cinder-high-speed
#   size: 10Gi
storage:
  size: 1Gi

# affinities can be used to schedule one replica per node
# https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
#
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#     - weigth: 100
#       podAffinityTerm:
#       labelSelector:
#         matchExpressions:
#         - key: app
#           operator: In
#           values:
#           - appsdb-mongodb-operated-svc
#         topologyKey: "kubernetes.io/hostname"

affinity: {}

# resources section to define limits and requests
# https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
#
# resources:
#   limits:
#     cpu: "2"
#     memory: 2Gi
#   requests:
#     cpu: 100m
#     memory: 200Mi

resources: {}

# update strategy of the primary instance during a rolling update (e.g. minor upgrade)
# see reference https://cloudnative-pg.io/docs/1.28/rolling_update
# primaryUpdateStrategy: unsupervised (default) or supervised
# primaryUpdateMethod: restart (default) or switchover (requires replicaCount > 1)
primaryUpdateStrategy: ""
primaryUpdateMethod: ""

# Continuous archiving and backups to an S3 object store through the
# barman-cloud plugin (recommended, requires the plugin in the cluster)
# see https://cloudnative-pg.io/plugin-barman-cloud/docs/
# It creates an ObjectStore, enables the WAL archiving on the cluster and a ScheduledBackup.
barmanCloud:
  enabled: false
  # Name of the ObjectStore, defaults to <cluster>-backup
  objectStoreName: ""
  endpointURL: https://s3.gra.cloud.ovh.net
  # S3 region, passed as AWS_DEFAULT_REGION to the sidecar.
  # Required by OVH: without it requests are rejected with "Bad Request".
  region: gra
  # Base path, barman stores each cluster under <destinationPath>/<serverName>
  # defaults to s3://cnpg-backups/<namespace>
  destinationPath: ""
  # Folder of this cluster in the object store, defaults to the cluster name.
  # Must be changed for a cluster restored from the backups of a cluster with the same name.
  serverName: ""
  # Secret holding the S3 credentials, defaults to global.secret (SOPS managed)
  s3Secret: ""
  accessKeyIdKey: ovh-s3-access-key
  secretAccessKeyKey: ovh-s3-secret-access-key
  # Recovery window: backups and WAL files no longer needed to restore the
  # database at any point of this window are deleted (e.g. 7d, 4w, 3m)
  retentionPolicy: "7d"
  # Compression of the base backups and WAL files
  compression: gzip
  scheduledBackup:
    enabled: true
    # CNPG cron with 6 fields (seconds first), in UTC: every day at 02:00 UTC
    schedule: "0 0 2 * * *"
    # Take a base backup as soon as the ScheduledBackup is created
    immediate: true
    # Owner of the Backup objects: self (ScheduledBackup), cluster or none
    backupOwnerReference: self

# Legacy in-tree continuous archiving (spec.backup.barmanObjectStore), deprecated
# since CNPG 1.26 in favour of the barman-cloud plugin (see barmanCloud above).
# Cannot be used together with barmanCloud.
# see fields reference
# https://cloudnative-pg.io/docs/1.28/cloudnative-pg.v1#backupconfiguration
# see PostgreSQL doc:
# https://www.postgresql.org/docs/current/continuous-archiving.html
# see operator blockstorage backup
# https://cloudnative-pg.io/docs/1.28/appendixes/backup_barmanobjectstore#common-object-stores

backup: {}

# configure additional plugins
# (the barman-cloud plugin entry is added automatically when barmanCloud.enabled is true)
# see reference https://cloudnative-pg.io/docs/1.28/cloudnative-pg.v1#pluginconfiguration

plugins: []
