{{- if and .Values.barmanCloud.enabled .Values.backup }}
{{- fail "barmanCloud and the legacy backup section cannot be enabled together: both archive WAL files" }}
{{- end }}
{{- $bootstrap := deepCopy (.Values.bootstrap | default dict) }}
{{- /* Helm merges the default initdb with user values: only one bootstrap method is allowed */}}
{{- if or (hasKey $bootstrap "recovery") (hasKey $bootstrap "pg_basebackup") }}
{{- $_ := unset $bootstrap "initdb" }}
{{- end }}
{{- if and .Values.ownerCredentials.password (hasKey $bootstrap "initdb") }}
{{- $initdb := get $bootstrap "initdb" }}
{{- if not (hasKey $initdb "secret") }}
{{- $_ := set $initdb "secret" (dict "name" (include "postgresql-operated.ownerSecretName" .)) }}
{{- end }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "postgresql-operated.clusterName" . }}
  labels:
{{ include "kargo.labels.standard" . | indent 4 }}
spec:
  inheritedMetadata:
    annotations:
    {{- with .Values.podAnnotations }}
      {{- toYaml . | nindent 6 }}
    {{- end }}
    labels:
{{ include "kargo.labels.standard" . | indent 6 }}
  imageName: {{ .Values.image.registry }}/{{ .Values.image.name }}:{{ include "postgresql-operated.imageTag" . }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  {{- with .Values.image.pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  instances: {{ .Values.replicaCount }}
  {{- with .Values.primaryUpdateStrategy }}
  primaryUpdateStrategy: {{ . }}
  {{- end }}
  {{- with .Values.primaryUpdateMethod }}
  primaryUpdateMethod: {{ . }}
  {{- end }}

  storage:
  {{- with .Values.storage }}
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.postgresql }}
  postgresql:
    {{- toYaml . | nindent 4 }}
  {{- end}}

  bootstrap:
  {{- with $bootstrap }}
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.externalClusters }}
  externalClusters:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.managed }}
  managed:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if .Values.superuserSecretName }}
  superuserSecret:
    name: {{ .Values.superuserSecretName }}
  enableSuperuserAccess: true
  {{- end }}

  {{- with .Values.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if or .Values.barmanCloud.enabled .Values.plugins }}
  plugins:
    {{- if .Values.barmanCloud.enabled }}
    # Continuous WAL archiving to the ObjectStore
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "postgresql-operated.objectStoreName" . }}
        {{- with .Values.barmanCloud.serverName }}
        serverName: {{ . }}
        {{- end }}
    {{- end }}
    {{- with .Values.plugins }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
