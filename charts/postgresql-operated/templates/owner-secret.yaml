{{- if .Values.ownerCredentials.password }}
---
# Credentials of the database owner, used by initdb
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql-operated.ownerSecretName" . }}
  labels:
{{ include "kargo.labels.standard" . | indent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ required "bootstrap.initdb.owner is required with ownerCredentials" .Values.bootstrap.initdb.owner | quote }}
  password: {{ .Values.ownerCredentials.password | quote }}
{{- end }}
